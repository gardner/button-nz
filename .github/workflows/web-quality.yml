name: Web Quality

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "scripts/check_file_length.py"
      - ".github/workflows/web-quality.yml"
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - "scripts/check_file_length.py"
      - ".github/workflows/web-quality.yml"

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: File length (max 500 lines, TypeScript source)
        working-directory: ${{ github.workspace }}
        run: >-
          python3 scripts/check_file_length.py --max-lines 500
          $(find apps/web
          -path '*/node_modules' -prune -o
          -path '*/.next' -prune -o
          -type f \( -name '*.ts' -o -name '*.tsx' \)
          ! -name '*.d.ts' ! -name '*.test.*' ! -name '*.spec.*'
          -print | sort)

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Lint (includes cyclomatic complexity, max 10)
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build (includes TypeScript checks)
        run: pnpm build
