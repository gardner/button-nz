version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # Python dependencies are managed with uv (uv.lock). Dependabot cannot
  # update uv.lock, so upgrade deliberately with: uv lock --upgrade
