repos:
  - repo: local
    hooks:
      - id: file-length
        name: Maximum 500 lines per Python source file
        entry: uv run --locked python scripts/check_file_length.py
        args: [--max-lines, "500"]
        language: system
        # First-party source only; vendored .agents skills are exempt.
        files: ^(src|scripts)/.*\.py$
        exclude: (^|/)(tests?(/|\.py$)|test_[^/]*\.py$|[^/]*_test\.py$|conftest\.py$)
        types: [python]
      - id: ruff
        name: Ruff lint and McCabe complexity
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
        files: ^(src|tests|scripts)/
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
        files: ^(src|tests|scripts)/
      - id: pyright
        name: Pyright type checking
        entry: uv run --locked pyright
        language: system
        pass_filenames: false
        files: ^(src/|tests/|scripts/|pyproject\.toml$|uv\.lock$)
      - id: file-length-ts
        name: Maximum 500 lines per TypeScript source file
        entry: uv run --locked python scripts/check_file_length.py
        args: [--max-lines, "500"]
        language: system
        # First-party source only; generated declarations are exempt.
        files: ^apps/web/.*\.(ts|tsx)$
        exclude: (^apps/web/(node_modules|\.next)/|\.d\.ts$|\.(test|spec)\.(ts|tsx)$)
      - id: shellcheck
        name: ShellCheck
        entry: uv run --locked shellcheck
        language: system
        types: [shell]
      - id: prettier
        name: Prettier (web app)
        # The files and settings of the web app's own format:check, which CI runs.
        entry: apps/web/node_modules/.bin/prettier --write
        language: system
        files: ^apps/web/(app/.*\.(ts|tsx|css)|lib/.*\.ts|proxy\.ts|next\.config\.ts|eslint\.config\.mjs|vitest\.(config\.mts|setup\.ts))$
