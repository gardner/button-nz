default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: file-length
        name: Maximum 500 lines per Python source file
        entry: uv run --locked python scripts/check_file_length.py
        args: [--max-lines, "500"]
        language: system
        # First-party source only; vendored .agents skills are exempt.
        files: ^(src|scripts)/.*\.py$
        exclude: (^|/)(tests?(/|\.py$)|test_[^/]*\.py$|[^/]*_test\.py$|conftest\.py$)
        types: [python]
      - id: ruff
        name: Ruff lint and McCabe complexity
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
        files: ^(src|tests|scripts)/
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
        files: ^(src|tests|scripts)/
      - id: pyright
        name: Pyright type checking
        entry: uv run --locked pyright
        language: system
        pass_filenames: false
        files: ^(src/|tests/|scripts/|pyproject\.toml$|uv\.lock$)
      - id: file-length-ts
        name: Maximum 500 lines per TypeScript source file
        entry: uv run --locked python scripts/check_file_length.py
        args: [--max-lines, "500"]
        language: system
        # First-party source only; generated declarations are exempt.
        files: ^apps/web/.*\.(ts|tsx)$
        exclude: (^apps/web/(node_modules|\.next)/|\.d\.ts$|\.(test|spec)\.(ts|tsx)$)
      - id: shellcheck
        name: ShellCheck
        entry: uv run --locked shellcheck
        language: system
        types: [shell]
      - id: claude-review
        name: Claude Code review of the outgoing diff
        # Writes ISSUES.md and blocks the push on P0-P2 findings.
        entry: scripts/pre-push-review.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        # pre-commit drops deleted paths, so a push whose commits only delete files would skip review.
        always_run: true
