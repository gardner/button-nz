[project]
name = "button-nz"
version = "0.1.0"
description = "Button NZ: AI-assisted 3D housing concepts from real property evidence"
readme = "README.md"
authors = [
    { name = "Gardner Bickford", email = "gardner@bickford.ai" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "meta-sam-parser>=0.1.0",
    "numpy>=2.5.4",
    "openai>=3.40.0",
    "pillow>=13.0.0",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
button-nz = "button_nz:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts", "scripts/demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src", "tests", "scripts"]
# scripts/demo: its scripts import each other when run as files.
extraPaths = ["src", "scripts", "scripts/demo", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "scripts/demo", "tests"]
markers = [
    "live: queries real third-party services; run with `pytest -m live`",
    "blender: runs headless Blender with a GPU; run with `pytest -m blender`",
]
addopts = "-m 'not live and not blender'"

[dependency-groups]
dev = [
    "av>=19.0.2",
    "httpx>=0.28.1",
    "playwright>=1.64.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "shellcheck-py>=0.11.0.1",
]
